<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#103b31">
  <title>A Christmas Surprise</title>
  <link rel="stylesheet" href="../ChristmasCss/Continue.css">
</head>
<body>
  <main class="page">
    <div class="snow" aria-hidden="true"></div>
    <section class="choices" aria-labelledby="greeting-title">
      <p class="dedication">Made with love, just for you</p>
      <h1 id="greeting-title">A little <span>something for you</span></h1>
      <p class="love-note">Choose your Christmas surprise <span aria-hidden="true">♥</span></p>
      <nav class="choice-list" aria-label="Christmas surprises">
        <a class="choice-card" href="Flowers.html">
          <span class="choice-icon" aria-hidden="true">💐</span>
          <span class="choice-title">Flowers for you</span>
          <span class="choice-description">A little bouquet, picked just for you</span>
          <span class="choice-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="choice-card" href="Images.html">
          <span class="choice-icon" aria-hidden="true">🖼️</span>
          <span class="choice-title">Images</span>
          <span class="choice-description">A few favorite moments together</span>
          <span class="choice-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="choice-card" href="ChristmasLetter.html">
          <span class="choice-icon" aria-hidden="true">💌</span>
          <span class="choice-title">Christmas letter</span>
          <span class="choice-description">A heartfelt note from me to you</span>
          <span class="choice-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
